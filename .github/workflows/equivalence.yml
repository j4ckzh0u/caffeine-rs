name: Equivalence

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CAFFEINE_VERSION: "3.3.1"

jobs:
  caffeine:
    name: Differential test against Java Caffeine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run the Rust trace
        run: cargo run --release --example equivalence_trace > rust.txt

      - name: Download Caffeine
        run: >
          curl -fsSL
          "https://repo1.maven.org/maven2/com/github/ben-manes/caffeine/caffeine/${CAFFEINE_VERSION}/caffeine-${CAFFEINE_VERSION}.jar"
          -o caffeine.jar

      - name: Run the Java trace
        run: >
          java -cp caffeine.jar
          tools/equivalence/CaffeineEquivalence.java > java.txt

      - name: Compare
        run: python3 tools/equivalence/compare.py java.txt rust.txt
